[project]
name = "agentic-iam-backend"
version = "0.1.0"
description = "Agentic AI Identity & Access Management POC - backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs live infrastructure (PostgreSQL)",
    "llm: needs a reachable Ollama with the configured model pulled",
]
