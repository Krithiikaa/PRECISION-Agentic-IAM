<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 880" width="1120" height="880" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .t   { font-size: 13px; fill: #0f172a; }
      .lbl { font-size: 11px; fill: #475569; }
      .sm  { font-size: 10px; fill: #64748b; }
      .hd  { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .ttl { font-size: 18px; font-weight: 600; fill: #0f172a; }
      .mono{ font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 10.5px; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .p1  { fill: #eff6ff; stroke: #93c5fd; }
      .p2  { fill: #f0fdf4; stroke: #86efac; }
      .p3  { fill: #fefce8; stroke: #fde047; }
      .p4  { fill: #f5f3ff; stroke: #c4b5fd; }
      .res { fill: #fff1f2; stroke: #fda4af; }
      .fut { fill: #f8fafc; stroke: #cbd5e1; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <text x="32" y="38" class="ttl">Phase 4 — Fine-grained authorization</text>
  <text x="32" y="58" class="lbl">PDP decides · AEM enforces · OPA/Rego evaluates · PIP gathers · PAP manages</text>

  <!-- Phase 2 feed -->
  <rect x="32" y="92" width="228" height="118" class="box p2"/>
  <text x="46" y="114" class="hd">PHASE 2 — credential trust</text>
  <text x="46" y="134" class="t">Credential verifier</text>
  <text x="46" y="152" class="sm">signature · expiry · revocation</text>
  <text x="46" y="168" class="sm">subject binding · status</text>
  <text x="46" y="192" class="mono">verdict, never a signature</text>

  <!-- Phase 3 feed -->
  <rect x="32" y="238" width="228" height="112" class="box p3"/>
  <text x="46" y="260" class="hd">PHASE 3 — discovery</text>
  <text x="46" y="280" class="t">ANS</text>
  <text x="46" y="298" class="sm">"which agent is suitable?"</text>
  <text x="46" y="320" class="sm" fill="#b45309">Discovery ≠ authorization.</text>
  <text x="46" y="336" class="sm" fill="#b45309">No policy logic in ANS.</text>

  <!-- Agent -->
  <rect x="330" y="92" width="200" height="82" class="box p1"/>
  <text x="344" y="114" class="hd">AGENT</text>
  <text x="344" y="134" class="sm">DID + Ed25519 (Phase 1)</text>
  <text x="344" y="152" class="sm">holds VCs, presents VPs</text>

  <!-- AEM -->
  <rect x="330" y="212" width="200" height="86" class="box p4"/>
  <text x="344" y="234" class="hd">AEM</text>
  <text x="344" y="252" class="sm">enforcement boundary</text>
  <text x="344" y="270" class="sm">builds the request from the</text>
  <text x="344" y="286" class="sm">TOOL's own resource/action</text>

  <!-- PIP -->
  <rect x="330" y="336" width="200" height="98" class="box p4"/>
  <text x="344" y="358" class="hd">PIP</text>
  <text x="344" y="376" class="sm">gathers context; decides nothing</text>
  <text x="344" y="394" class="sm">calls the Phase 2 verifier</text>
  <text x="344" y="412" class="sm">unavailable → null, never a</text>
  <text x="344" y="426" class="sm">default and never "trusted"</text>

  <!-- PDP -->
  <rect x="330" y="472" width="200" height="86" class="box p4"/>
  <text x="344" y="494" class="hd">PDP</text>
  <text x="344" y="512" class="sm">decides; never executes</text>
  <text x="344" y="530" class="sm">strips self-asserted verdicts</text>
  <text x="344" y="548" class="sm">fail-closed on every error</text>

  <!-- OPA -->
  <rect x="330" y="596" width="200" height="92" class="box p4"/>
  <text x="344" y="618" class="hd">OPA (real runtime)</text>
  <text x="344" y="636" class="mono">openpolicyagent/opa :8181</text>
  <text x="344" y="656" class="sm">Rego v1 policy modules</text>
  <text x="344" y="674" class="sm">the only place allow/deny lives</text>

  <!-- PAP -->
  <rect x="600" y="596" width="220" height="92" class="box p4"/>
  <text x="614" y="618" class="hd">PAP</text>
  <text x="614" y="636" class="sm">policy lifecycle: id, version,</text>
  <text x="614" y="654" class="sm">owner, scope, status</text>
  <text x="614" y="674" class="sm">activate = PUT · deactivate = DELETE</text>

  <!-- Decision -->
  <rect x="600" y="452" width="220" height="112" class="box"/>
  <text x="614" y="474" class="hd">DECISION</text>
  <text x="614" y="496" class="t" fill="#059669">ALLOW</text>
  <text x="614" y="516" class="t" fill="#e11d48">DENY</text>
  <text x="614" y="536" class="t" fill="#b45309">HUMAN_APPROVAL_REQUIRED</text>
  <text x="614" y="554" class="sm">+ policy id · version · reason</text>

  <!-- Tool + resource -->
  <rect x="600" y="212" width="220" height="86" class="box res"/>
  <text x="614" y="234" class="hd">PROTECTED TOOL</text>
  <text x="614" y="252" class="mono">get_credit_profile</text>
  <text x="614" y="270" class="sm">requires a single-use</text>
  <text x="614" y="288" class="sm">EnforcementGrant from the AEM</text>

  <rect x="600" y="92" width="220" height="82" class="box res"/>
  <text x="614" y="114" class="hd">RESOURCE</text>
  <text x="614" y="134" class="mono">credit_records</text>
  <text x="614" y="152" class="mono">payroll_records</text>

  <!-- Future HITL -->
  <rect x="880" y="452" width="208" height="236" class="box fut"/>
  <text x="894" y="474" class="hd" fill="#64748b">FUTURE — HITL</text>
  <text x="894" y="496" class="sm">NOT IMPLEMENTED</text>
  <text x="894" y="522" class="sm">Keycloak</text>
  <text x="894" y="540" class="sm">OIDC / SAML</text>
  <text x="894" y="558" class="sm">↓</text>
  <text x="894" y="576" class="sm">human authentication</text>
  <text x="894" y="594" class="sm">↓</text>
  <text x="894" y="612" class="sm">human approval</text>
  <text x="894" y="630" class="sm">↓</text>
  <text x="894" y="648" class="sm">approval artifact</text>
  <text x="894" y="666" class="sm">↓ back to the PDP</text>

  <!-- flows -->
  <line x1="430" y1="174" x2="430" y2="212" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="440" y="197" class="lbl">wants a protected tool</text>

  <line x1="430" y1="298" x2="430" y2="336" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="430" y1="434" x2="430" y2="472" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="440" y="458" class="lbl">context</text>
  <line x1="430" y1="558" x2="430" y2="596" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="440" y="581" class="lbl">input document</text>

  <line x1="530" y1="640" x2="600" y2="640" stroke="#64748b" stroke-width="1.6" marker-start="url(#arrow)"/>
  <text x="536" y="632" class="lbl">loads</text>

  <path d="M 530 620 L 566 620 L 566 508 L 600 508" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="572" y="576" class="lbl">verdict</text>

  <path d="M 600 490 L 566 490 L 566 255 L 530 255" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="452" y="322" class="lbl" fill="#059669">ALLOW → grant</text>

  <line x1="530" y1="255" x2="600" y2="255" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <line x1="710" y1="212" x2="710" y2="174" stroke="#059669" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Phase 2 -> PIP -->
  <path d="M 260 150 L 296 150 L 296 385 L 330 385" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="196" y="228" class="lbl" fill="#059669">verified claims</text>

  <!-- Phase 3 -> agent -->
  <path d="M 260 280 L 296 280 L 296 133 L 330 133" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- blocked path -->
  <path d="M 330 240 L 286 240 L 286 214" fill="none" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <text x="150" y="212" class="lbl" fill="#e11d48">DENY / HUMAN → blocked</text>

  <!-- bypass blocked -->
  <path d="M 430 133 L 860 133" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="640" y1="112" x2="660" y2="154" stroke="#e11d48" stroke-width="2.6"/>
  <line x1="660" y1="112" x2="640" y2="154" stroke="#e11d48" stroke-width="2.6"/>
  <text x="676" y="182" class="lbl" fill="#e11d48">direct access is impossible</text>

  <!-- footer rules -->
  <rect x="32" y="726" width="1056" height="118" class="box"/>
  <text x="50" y="750" class="hd">The rules this diagram encodes</text>
  <text x="50" y="774" class="t">IDENTITY ≠ AUTHORIZATION   ·   DISCOVERY ≠ AUTHORIZATION   ·   AUTHENTICATION ≠ AUTHORIZATION   ·   LLM DECISION ≠ SECURITY DECISION</text>
  <text x="50" y="798" class="t">PDP DECISION + AEM ENFORCEMENT = AUTHORIZED ACTION</text>
  <text x="50" y="822" class="sm">Fail-closed: OPA unavailable, policy unloaded, no matching rule, malformed request and unresolvable subject all DENY. No error path yields ALLOW.</text>
</svg>
